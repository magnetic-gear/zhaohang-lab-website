{%- assign icon = include.icon -%}
{%- assign size = include.size | default: "" -%}

{%- if icon contains ".svg" -%}
  {%- capture inline -%}
    {%- include {{ icon }} -%}
  {%- endcapture -%}
  <span class="icon {% if size %}icon-{{ size }}{% endif %}">
    {{- inline | strip_newlines -}}
  </span>
{%- elsif icon and icon != "" -%}
  <i class="icon {{ icon }} {% if size %}size-{{ size }}{% endif %}"></i>
{%- endif -%}
